<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>University page, Guidebook mockup</title>
<link rel="icon" href="../../static/img/logo.svg">
<link rel="stylesheet" href="../../src/css/tokens.css">
<link rel="stylesheet" href="assets/mockup.css">
<script>
  try {
    var t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('mockup.theme') || 'auto';
    var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
</script>
</head>
<body>
<div id="mockbar" class="mockbar"></div>
<header id="navbar" class="navbar"></header>
<div id="drawer" class="drawer" hidden></div>
<div class="layout">
  <nav id="sidebar" class="sidebar"></nav>
  <main id="main" class="main"></main>
  <aside id="rail" class="rail"></aside>
</div>
<footer id="footer" class="footer"></footer>
<button id="ai" class="ai" type="button"></button>
<script src="assets/content.js"></script>
<script src="assets/mockup.js"></script>
</body>
</html>
