name: CI

on:
  pull_request:
    branches: [main]

env:
  # onnxruntime-node (plugins/semantic-search) would otherwise download its
  # CUDA binaries during npm ci on Linux; the build runs the model on the CPU.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sync content from Drive
        # Mirrors the deploy workflow — PRs preview the *current* Drive
        # content, not the committed legacy MDX. If GDRIVE_* secrets aren't
        # set on a fork PR this step will fail; that's intentional for now
        # since this is a single-author repo.
        run: PYTHONPATH=scripts python -m drive_sync
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_CONTENT_ROOT_ID: ${{ secrets.GDRIVE_CONTENT_ROOT_ID }}
      - run: npm ci
      # Reuse the deploys' embedding model and embeddings
      # (plugins/semantic-search); a pull request only reads the caches, it
      # never saves its own copy.
      - uses: actions/cache/restore@v4
        with:
          path: .cache/semantic-search/models
          key: semantic-search-model-${{ hashFiles('plugins/semantic-search/embedder.ts') }}
      - uses: actions/cache/restore@v4
        with:
          path: .cache/semantic-search/vectors
          key: semantic-search-vectors-${{ github.run_id }}
          restore-keys: semantic-search-vectors-
      - run: npm run build

  python-tests:
    # Pytest gate for the drive-sync pipeline (parser/emitter against
    # committed fixtures). Runs in parallel with the docusaurus build job so
    # PR authors see a single CI status. No Drive credentials needed —
    # everything runs against scripts/drive_sync/tests/fixtures/.
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest

  plugin-tests:
    # Unit tests for the build plugins (the chatbot corpus, the deadlines
    # homepage-data reads from the pages, and the semantic search index), the
    # landing page's date rules and the search box's engine. Node 24 runs
    # TypeScript directly; the install is for @docusaurus/utils, whose slugger
    # gives search results the pages' own heading ids.
    name: Plugin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test --disable-warning=MODULE_TYPELESS_PACKAGE_JSON plugins/*/*.test.ts src/components/Homepage/UpcomingDeadlines/*.test.ts src/components/Search/*.test.ts
